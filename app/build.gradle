plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.qrbinrunner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.qrbinrunner'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
